<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Competition Studio</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#1f2937;
    color:white;
}

header{
    background:#2563eb;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

main{
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
}

.menu{
    display:grid;
    gap:20px;
    width:300px;
}

button{
    padding:18px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

</style>

</head>

<body>

<header>
Robot Competition Studio
</header>

<main>

<div class="menu">

<button>🛠️ สร้างสนาม</button>

<button>🤖 จำลองหุ่นยนต์</button>

<button>💻 เขียนโปรแกรม</button>

<button>🏆 แข่งขัน</button>

<button>⚙️ ตั้งค่า</button>

</div>

</main>

</body>
</html>
